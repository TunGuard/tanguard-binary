name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # Stamp the tag into the binary. Without -X tanguard/config.Version the
      # build falls back to the placeholder in config/version.go, so the
      # released binary reports a version that does not match its own release
      # and the dashboard keeps offering an update that is already installed.
      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X tanguard/config.Version=${VERSION}"
          echo "building version ${VERSION}"
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/tanguard-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/tanguard-linux-arm64 .
          GOOS=linux GOARCH=386 go build -ldflags="$LDFLAGS" -o dist/tanguard-linux-386 .

      - name: Generate checksums
        run: |
          cd dist
          sha256sum tanguard-* > checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
