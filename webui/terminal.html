<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TunGuard - Terminal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<script>try{if(localStorage.getItem('tg-theme')==='light')document.documentElement.classList.add('light')}catch(e){}</script>
<script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embed')</script>
</head>
<body data-page="terminal">
<div class="app-shell">

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
    <div>
      <div class="logo-text">TunGuard</div>
      <div class="logo-sub">WireGuard Server</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">Main</div>
    <a href="index.html" class="nav-item">
      <span class="nav-icon"><i class="fa-solid fa-gauge"></i></span>
      <span class="nav-label">Dashboard</span>
    </a>
    <a href="peers.html" class="nav-item">
      <span class="nav-icon"><i class="fa-solid fa-users"></i></span>
      <span class="nav-label">Peers</span>
      <span class="nav-badge" id="nav-peer-count" style="display:none">0</span>
    </a>
    <a href="p2p.html" class="nav-item">
      <span class="nav-icon"><i class="fa-solid fa-diagram-project"></i></span>
      <span class="nav-label">P2P</span>
      <span class="nav-badge" id="nav-p2p-count" style="display:none">0</span>
    </a>
    <a href="trp.html" class="nav-item">
      <span class="nav-icon"><i class="fa-solid fa-route"></i></span>
      <span class="nav-label">TRP</span>
      <span class="nav-badge" id="nav-trp-count" style="display:none">0</span>
    </a>
    <a href="policy.html" class="nav-item">
      <span class="nav-icon"><i class="fa-solid fa-shield-halved"></i></span>
      <span class="nav-label">Policy Groups</span>
      <span class="nav-badge" id="nav-policy-count" style="display:none">0</span>
    </a>
    <div class="nav-section-label">System</div>
    <a href="terminal.html" class="nav-item active">
      <span class="nav-icon"><i class="fa-solid fa-terminal"></i></span>
      <span class="nav-label">Terminal</span>
    </a>
    <a href="settings.html" class="nav-item">
      <span class="nav-icon"><i class="fa-solid fa-gear"></i></span>
      <span class="nav-label">Settings</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="sidebar-status">
      <div class="sidebar-status-title">Server Status</div>
      <div class="sidebar-status-list" id="sidebarStatusList">
        <div class="sidebar-status-item"><span class="status-dot loading"></span><span>Loading…</span></div>
      </div>
    </div>
    <a href="#" class="sidebar-collapse-btn" onclick="logout();return false;">
      <i class="fa-solid fa-right-from-bracket"></i>
      <span class="nav-label">Logout</span>
    </a>
  </div>
</aside>

<main class="main-content" id="main-content">
  <div class="topbar">
    <button class="icon-btn topbar-menu-btn" onclick="toggleSidebar()" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </button>
    <div class="topbar-brand">
      <i class="fa-solid fa-shield-halved brand-mark-i"></i>
      <span class="brand-name">TUNGUARD</span>
    </div>
    <span class="topbar-sep"></span>
    <div class="topbar-title">Terminal</div>
    <div class="topbar-actions">
      <button class="theme-toggle" id="themeToggleBtn" type="button" onclick="toggleTheme()" title="Toggle light / dark theme">
        <svg class="ico-sun" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span id="themeLabel">Dark</span>
      </button>
      <a href="settings.html" class="icon-btn" data-tip="Settings">
        <i class="fa-solid fa-gear"></i>
      </a>
      <div class="avatar" title="TunGuard">T</div>
    </div>
  </div>

  <div class="terminal-page">
    <div class="term-shell">
      <div class="term-head">
        <span class="term-head-left">TunGuard CLI</span>
        <span class="term-state" id="termState">connecting</span>
      </div>
      <div id="term"></div>
      <div class="term-hint">
        <span><b>Tab</b> complete</span>
        <span><b>↑↓</b> history</span>
        <span><b>Ctrl-A/E</b> home/end</span>
        <span><b>Ctrl-U/K/W</b> edit</span>
        <span><b>Ctrl-L</b> clear</span>
        <span><b>Ctrl-C</b> cancel / stop</span>
        <span><b>exit</b> to leave</span>
      </div>
    </div>
  </div>
</main>

</div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script src="common.js"></script>
<script src="terminal.js"></script>
</body>
</html>
