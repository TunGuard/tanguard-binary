<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TunGuard - Set your dashboard login</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
<div class="login-page">

  <div class="login-brand">
    <div class="login-logo">
      <span class="login-logo-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4a2 2 0 0 1 2 2c0 .73-.4 1.37-1 1.72V11h-2V8.72c-.6-.35-1-1-1-1.72a2 2 0 0 1 2-2zm2 11h-4v-2h4v2z"/></svg>
      </span>
      <span class="login-logo-text">TunGuard</span>
    </div>
    <p class="login-tagline">Userspace WireGuard VPN server</p>
  </div>

  <div class="card login-panel">
    <div class="card-header">
      <span class="card-title">Set your dashboard login</span>
    </div>
    <div class="card-body">

      <div class="alert alert-warning">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
        <span>You are still on the shipped <code>admin</code> / <code>tanguard</code> login. Pick your own credentials before using the dashboard — the same login opens the SSH gateway.</span>
      </div>

      <form class="web-login-form" onsubmit="changeCredentials(event)">
        <div class="form-row-3">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input class="form-control" name="username" placeholder="New username" required autocomplete="off" autofocus>
          </div>
          <div class="form-group">
            <label class="form-label">New password (min 8 chars)</label>
            <input class="form-control" name="password" type="password" placeholder="New password" required autocomplete="new-password">
          </div>
          <div class="form-group">
            <label class="form-label">Confirm password</label>
            <input class="form-control" name="confirm_password" type="password" placeholder="Confirm password" required autocomplete="new-password">
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Save &amp; Log In</button>
      </form>

    </div>
  </div>

  <div class="login-footer">
    <span class="login-meta">
      <svg class="login-meta-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Soul creator:</span>
      <a href="https://github.com/frost-bit-star" target="_blank" rel="noopener noreferrer">Frost-bit-star</a>
    </span>
    <span class="login-meta">
      <svg class="login-meta-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58s1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/></svg>
      <span>Running version:</span>
      <span class="login-version" id="login-version">v—</span>
      <span class="login-update" id="login-update" style="display:none">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2zM12 4v9.17l3.59-3.58L17 11l-5 5-5-5 1.41-1.41L12 13.17V4z"/></svg>
        <span>update available:</span>
        <span class="login-latest" id="login-latest">—</span>
      </span>
    </span>
  </div>

</div>

<script src="common.js"></script>
<script src="login.js"></script>
</body>
</html>
