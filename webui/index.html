<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TunGuard - Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed" data-page="dashboard">
<div class="wrapper">

<div class="content-wrapper">
<section class="content">
<div class="container-fluid py-4">

<div class="mb-4 d-flex justify-content-between align-items-end flex-wrap">
<div>
<h4 class="mb-1" style="font-weight:800;color:#1a1a2e;">Welcome back! 👋</h4>
<p class="text-muted mb-0" style="font-size:.9rem;">Here's what's happening with your WireGuard server.</p>
</div>
<small class="text-muted" id="lastUpdated" style="font-size:.8rem;">Last updated: —</small>
</div>

<div class="row mb-4">
<div class="col-xl-4 col-md-6 mb-3">
<div class="dash-stat-card">
<div class="icon-box" style="background:linear-gradient(135deg,#4e73df,#224abe);"><i class="fas fa-key"></i></div>
<div class="stat-value" id="pubkey" style="font-size:1rem;">—</div>
<div class="stat-label">Server Public Key</div>
</div>
</div>
<div class="col-xl-4 col-md-6 mb-3">
<div class="dash-stat-card">
<div class="icon-box" style="background:linear-gradient(135deg,#28a745,#1e7e34);"><i class="fas fa-plug"></i></div>
<div class="stat-value" id="port">—</div>
<div class="stat-label">Listen Port</div>
</div>
</div>
<div class="col-xl-4 col-md-6 mb-3">
<div class="dash-stat-card">
<div class="icon-box" style="background:linear-gradient(135deg,#17a2b8,#117a8b);"><i class="fas fa-globe"></i></div>
<div class="stat-value" id="subnet">—</div>
<div class="stat-label">Subnet</div>
</div>
</div>
<div class="col-xl-4 col-md-6 mb-3">
<div class="dash-stat-card">
<div class="icon-box" style="background:linear-gradient(135deg,#ffc107,#e0a800);"><i class="fas fa-users"></i></div>
<div class="stat-value" id="peer-count">0</div>
<div class="stat-label">Peers</div>
</div>
</div>
<div class="col-xl-4 col-md-6 mb-3">
<div class="dash-stat-card">
<div class="icon-box" style="background:linear-gradient(135deg,#6f42c1,#49197a);"><i class="fas fa-arrow-up"></i></div>
<div class="stat-value" id="total-tx">0 B</div>
<div class="stat-label">Total TX</div>
</div>
</div>
<div class="col-xl-4 col-md-6 mb-3">
<div class="dash-stat-card">
<div class="icon-box" style="background:linear-gradient(135deg,#fd7e14,#c2590c);"><i class="fas fa-arrow-down"></i></div>
<div class="stat-value" id="total-rx">0 B</div>
<div class="stat-label">Total RX</div>
</div>
</div>
</div>

<div class="row">
<div class="col-12">
<div class="chart-card">
<h6 class="mb-3"><i class="fas fa-bolt text-warning mr-1"></i> Quick Actions</h6>
<div class="row">
<div class="col-md-4 mb-2"><a class="quick-action-btn" href="peers.html"><i class="fas fa-network-wired text-primary"></i> Manage Peers</a></div>
<div class="col-md-4 mb-2"><a class="quick-action-btn" href="peers.html?action=generate"><i class="fas fa-plus-circle text-success"></i> New Device Config</a></div>
<div class="col-md-4 mb-2"><a class="quick-action-btn" href="#" onclick="loadDashboard()"><i class="fas fa-sync-alt text-warning"></i> Refresh</a></div>
</div>
</div>
</div>
</div>

</div>
</section>
</div>

</div>
<script src="common.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
